<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="Unsolved rubix cube.">
    </section>

    <section>
        <h2>Payment Information</h2>
        <form>
            <label for="card-name" name="card-name" type="text">
                Card Name: <span aria-hidden="true">*</span>
            </label>
            <input required type="text" id="card-name" name="card-name">
            <label for="card-number" name="card-number" type="text">
                Card Number: <span aria-hidden="true">*</span>
            </label>
            <input required id="card-number" name="card-number" type="text" aria-describedby="card-number-help">
            <p id="card-number-help" aria-describedby="card-number-help">Please enter a 16 digit card number without spaces or dashes.</p>
        </form>
    </section>
</body>

</html>
